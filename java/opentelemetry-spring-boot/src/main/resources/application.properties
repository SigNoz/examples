# Server port
server.port=8085

# disable micrometer metrics export
management.otlp.metrics.export.enabled=false
# disable micrometer traces export
management.otlp.traces.export.enabled=false

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# Log level: show our demo logs at DEBUG, keep framework noise at INFO/WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] [%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.apache.catalina.core=ERROR

# All OTel configuration is done via environment variables (see Makefile / README).
# Do NOT put OTLP endpoints or ingestion keys here — keep secrets out of source.
#
# The agent reads the following env vars at JVM startup:
#   OTEL_SERVICE_NAME
#   OTEL_EXPORTER_OTLP_ENDPOINT
#   OTEL_EXPORTER_OTLP_HEADERS
#   OTEL_RESOURCE_ATTRIBUTES
#   OTEL_LOGS_EXPORTER
#   OTEL_METRICS_EXPORTER
