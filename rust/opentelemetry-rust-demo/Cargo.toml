[package]
name = "opentelemetry-rust-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# hyper web server dependencies
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }

# application-logic dependencies
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"

# opentelemetry dependencies
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "http-json",
    # * this is mandatory to export data directly to any deployed backend not in local network!
    "reqwest-rustls",
] }
opentelemetry-stdout = { version = "0.31" }
opentelemetry-semantic-conventions = { version = "0.31", features = [
    "semconv_experimental",
] }
