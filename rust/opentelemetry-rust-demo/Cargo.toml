[package]
name = "opentelemetry-rust-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# hyper web server dependencies
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }

# application-logic dependencies
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"

# opentelemetry dependencies
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    # to send data to secure endpoints over gRPC
    "tls-roots",
] }
opentelemetry-stdout = { version = "0.31" }
opentelemetry-semantic-conventions = { version = "0.31", features = [
    "semconv_experimental",
] }
opentelemetry-appender-tracing = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.32"
tonic = { version = "0.14", default-features = false, features = [
    "tls-native-roots",
] }
