receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  logging:
    loglevel: info
  # Uncomment and configure for SigNoz
  # otlp:
  #   endpoint: <SIGNOZ_ENDPOINT>
  #   headers:
  #     signoz-ingestion-key: <YOUR_KEY>

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]  # Change to [otlp] for SigNoz
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]  # Change to [otlp] for SigNoz
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]  # Change to [otlp] for SigNoz
